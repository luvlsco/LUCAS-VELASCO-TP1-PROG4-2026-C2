<h2>Top 3 más vendidas</h2>

@for (m of store.top3(); track m.id) {
  <article>
    <a [routerLink]="['/peliculas', m.id]">
      <img [src]="m.image" [alt]="m.title" width="120" />
      <h3>{{ m.title }}</h3>
    </a>
    <p>{{ m.soldTickets }} entradas</p>
  </article>
}

<h2>Destacadas</h2>

@if (store.featured().length === 0) {
  <p>No hay películas destacadas.</p>
} @else {
  @for (m of store.featured(); track m.id) {
    <article>
      <a [routerLink]="['/peliculas', m.id]">
        <img [src]="m.image" [alt]="m.title" width="120" />
        <h3>{{ m.title }}</h3>
      </a>
    </article>
  }
}
